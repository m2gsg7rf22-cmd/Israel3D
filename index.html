<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPEN CITY — Meridian Bay</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <canvas id="minimap" width="140" height="140"></canvas>

    <div id="hud">
      <div class="hud-item"><span class="label">מהירות</span><span id="hud-speed">0</span><span class="unit">קמ״ש</span></div>
      <div class="hud-item"><span class="label">מצב</span><span id="hud-mode">הליכה</span></div>
      <div class="hud-item"><span class="label">שעה</span><span id="hud-clock">☀️ יום</span></div>
    </div>

    <div id="hud-msg"></div>

    <div id="screen-start" class="screen">
      <h1>🏙️ OPEN CITY <span>Meridian Bay</span></h1>
      <p class="desc">עולם פתוח קטן: מכונית, אופנוע והליכה חופשית בעיר עם בניינים וחנויות.<br>התקרבו לרכב ולחצו F כדי לעלות עליו, ושוב F כדי לרדת.</p>
      <div class="controls-info">
        <div><strong>⬅️➡️ / A D</strong><span>היגוי</span></div>
        <div><strong>⬆️⬇️ / W S</strong><span>גז / בלם-אחורה</span></div>
        <div><strong>Shift</strong><span>ספרינט</span></div>
        <div><strong>Space</strong><span>קפיצה</span></div>
        <div><strong>F</strong><span>כניסה/יציאה מהרכב</span></div>
      </div>
      <button id="btn-start" class="btn">התחל שיטוט</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h1>⏸ השהיה</h1>
      <button id="btn-resume" class="btn">המשך</button>
      <button id="btn-restart-pause" class="btn btn-secondary">המשך משחק</button>
    </div>

    <button id="btn-pause" class="icon-btn hidden" title="השהיה">⏸</button>

    <div id="touch-controls" class="hidden">
      <button id="t-left" class="t-btn">⬅️</button>
      <div class="t-mid">
        <button id="t-up" class="t-btn">⬆️</button>
        <button id="t-down" class="t-btn">⬇️</button>
      </div>
      <button id="t-right" class="t-btn">➡️</button>
      <div class="t-actions">
        <button id="t-jump" class="t-btn t-btn-small">⤴</button>
        <button id="t-run" class="t-btn t-btn-small">🏃</button>
        <button id="t-action" class="t-btn t-btn-small">F</button>
      </div>
    </div>
  </div>

<script type="module" src="game.js"></script>
</body>
</html>
